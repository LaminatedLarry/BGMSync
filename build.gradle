plugins {
    id 'java'
    id 'fabric-loom' version '1.6.10'
    id 'maven-publish'
}
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
archivesBaseName = 'BGMSync'
version = '1.0.0'
group = 'com.bgmsync'
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}
dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.7"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1"
}
loom { splitEnvironmentSourceSets() }
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar() }
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { mavenLocal() }
}